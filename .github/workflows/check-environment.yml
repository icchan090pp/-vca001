name: Development environment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - name: Validate Codespaces configuration
        run: python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
      - name: Verify Cloud Environment workflows three times
        run: bash scripts/cloud-environment.sh verify
      - name: Save verification reports and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cloud-environment-verification
          path: artifacts/
          if-no-files-found: ignore

  codespaces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test the Codespaces container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash scripts/cloud-environment.sh verify
      - name: Save container reports and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: codespaces-verification
          path: artifacts/
          if-no-files-found: ignore
