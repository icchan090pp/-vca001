name: Development environment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - name: Validate Codespaces configuration
        run: python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
      - name: Check development tools
        run: bash scripts/check-environment.sh
